name: sha1

on:
  pull_request:
    paths:
      - ".github/workflows/sha1.yml"
      - "sha1/**"
      - "Cargo.*"
  push:
    branches: master

defaults:
  run:
    working-directory: sha1

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: 0

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        prepare:
          - msrv
          - stable
        target:
          - thumbv7em-none-eabi
          - wasm32-unknown-unknown
          - loongarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
          targets: ${{ matrix.target }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      - run: cargo hack build --target ${{ matrix.target }} --each-feature --exclude-features default

  # Linux tests
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 32-bit Linux/x86
          #- target: i686-unknown-linux-gnu
          #  prepare: msrv
          #  deps: sudo apt update && sudo apt install gcc-multilib
          #- target: i686-unknown-linux-gnu
          #  prepare: stable
          #  deps: sudo apt update && sudo apt install gcc-multilib

          # 64-bit Linux/x86_64
          - target: x86_64-unknown-linux-gnu
            prepare: msrv
          - target: x86_64-unknown-linux-gnu
            prepare: stable
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      - run: ${{ matrix.deps }}
      - run: cargo hack test --feature-powerset
      - run: cargo test --all-features
        env:
          RUSTFLAGS: -Dwarnings --cfg sha1_backend="soft"

  # macOS tests
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        prepare:
          - msrv
          - stable
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
      - run: cargo test --no-default-features
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo test --all-features
        env:
          RUSTFLAGS: -Dwarnings --cfg sha1_backend="aarch64-sha2"
      - run: cargo test --all-features
        env:
          RUSTFLAGS: -Dwarnings --cfg sha1_backend="soft"

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        prepare:
          - msrv
          - stable
        target:
          - aarch64-unknown-linux-gnu
          - powerpc-unknown-linux-gnu
    defaults:
      run:
        # Cross mounts only current package, i.e. by default it ignores workspace's Cargo.toml
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
      - uses: RustCrypto/actions/cross-install@prepare-lock-toolchain
      - run: cross test
          --package ${{ github.workflow }}
          --target ${{ matrix.target }}
