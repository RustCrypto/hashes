name: blake2

on:
  pull_request:
    paths:
      - ".github/workflows/blake2.yml"
      - "blake2/**"
      - "Cargo.*"
  push:
    branches: master

defaults:
  run:
    working-directory: blake2

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        prepare:
          - msrv
          - stable
        target:
          - thumbv7em-none-eabi
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
          targets: ${{ matrix.target }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      - run: cargo hack build --target ${{ matrix.target }} --each-feature --exclude-features default,simd,simd_asm,simd_opt

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        prepare:
          - stable
          - msrv
          - minimal-versions
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      - run: cargo hack test --feature-powerset --exclude-features simd,simd_asm,simd_opt

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        prepare:
          - msrv
          - stable
        target:
          - aarch64-unknown-linux-gnu
          - powerpc-unknown-linux-gnu
    defaults:
      run:
        # Cross mounts only current package, i.e. by default it ignores workspace's Cargo.toml
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
      - uses: RustCrypto/actions/cross-install@prepare-lock-toolchain
      - run: cross test
          --package ${{ github.workflow }}
          --target ${{ matrix.target }}
