name: sha2

on:
  pull_request:
    paths:
      - ".github/workflows/sha2.yml"
      - "sha2/**"
      - "Cargo.*"
  push:
    branches: master

defaults:
  run:
    working-directory: sha2

env:
  RUSTFLAGS: -Dwarnings
  CARGO_INCREMENTAL: 0

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        prepare:
          - msrv
          - stable
        target:
          - thumbv7em-none-eabi
          - wasm32-unknown-unknown
          - loongarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
          targets: ${{ matrix.target }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      - run: cargo hack build --target ${{ matrix.target }} --each-feature --exclude-features default

  # Linux tests
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 32-bit Linux/x86
          - target: i686-unknown-linux-gnu
            prepare: msrv
            deps: sudo apt update && sudo apt install gcc-multilib
          - target: i686-unknown-linux-gnu
            prepare: stable
            deps: sudo apt update && sudo apt install gcc-multilib

          # 64-bit Linux/x86_64
          - target: x86_64-unknown-linux-gnu
            prepare: msrv
          - target: x86_64-unknown-linux-gnu
            prepare: stable
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
          targets: ${{ matrix.target }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      - run: ${{ matrix.deps }}
      - run: cargo hack test --feature-powerset --target ${{ matrix.target }}
      - run: cargo test --all-features --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="soft"
      - run: cargo test --all-features --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="soft" --cfg sha2_backend_soft="compact"

  # macOS tests
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        prepare:
          - msrv
          - stable
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
      - run: cargo test --no-default-features
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo test --all-features
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="soft"
      - run: cargo test --all-features
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="soft" --cfg sha2_backend_soft="compact"

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        prepare:
          - msrv
          - stable
        target:
          - aarch64-unknown-linux-gnu
          - powerpc-unknown-linux-gnu
    defaults:
      run:
        # Cross mounts only current package, i.e. by default it ignores workspace's Cargo.toml
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
      - uses: RustCrypto/actions/cross-install@prepare-lock-toolchain
      - run: cross test
          --package ${{ github.workflow }}
          --target ${{ matrix.target }}

  riscv64-zknh:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Cross mounts only current package, i.e. by default it ignores workspace's Cargo.toml
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - name: Install Cross
        env:
          # Do not fail on compilation warnings
          RUSTFLAGS: ""
        run: cargo install cross --git https://github.com/cross-rs/cross
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - run: cross test --package sha2 --all-features --target riscv64gc-unknown-linux-gnu
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="soft"
      - run: cross test --package sha2 --all-features --target riscv64gc-unknown-linux-gnu
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="soft" --cfg sha2_backend_soft="compact"
      - run: cross test --package sha2 --all-features --target riscv64gc-unknown-linux-gnu
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="riscv-zknh" -C target-feature=+zknh,+zbkb
      - run: cross test --package sha2 --all-features --target riscv64gc-unknown-linux-gnu
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="riscv-zknh" --cfg sha2_backend_riscv_zknh="compact" -C target-feature=+zknh,+zbkb

  riscv32-zknh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src
      - run: cargo build --all-features --target riscv32gc-unknown-linux-gnu -Z build-std=core,alloc
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="soft"
      - run: cargo build --all-features --target riscv32gc-unknown-linux-gnu -Z build-std=core,alloc
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="soft" --cfg sha2_backend_soft="compact"
      - run: cargo build --all-features --target riscv32gc-unknown-linux-gnu -Z build-std=core,alloc
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="riscv-zknh" -C target-feature=+zknh,+zbkb
      - run: cargo build --all-features --target riscv32gc-unknown-linux-gnu -Z build-std=core,alloc
        env:
          RUSTFLAGS: -Dwarnings --cfg sha2_backend="riscv-zknh" --cfg sha2_backend_riscv_zknh="compact" -C target-feature=+zknh,+zbkb

  # wasmtime tests
  wasm:
    strategy:
      matrix:
        include:
          # without simd
          - prepare: msrv
            flags: "-C target-feature=-simd128"
          - prepare: stable
            flags: "-C target-feature=-simd128"

          # with simd
          - prepare: msrv
            flags: "-C target-feature=+simd128"
          - prepare: stable
            flags: "-C target-feature=+simd128"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: RustCrypto/actions/prepare-lock-toolchain@prepare-lock-toolchain
        with:
          prepare: ${{ matrix.prepare }}
          package: ${{ github.workflow }}
          targets: wasm32-wasip1
      - uses: RustCrypto/actions/cargo-hack-install@master
      - uses: jcbhmr/setup-wasmtime@v2
      - run: cargo hack test --feature-powerset --target wasm32-wasip1
        env:
          RUSTFLAGS: ${{ matrix.flags }}
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
